# Source: l0ng-ai/zed, fb44723 (tty7 branch). Workspace dependencies expanded for vendoring.
[package]
name = "gpui_wgpu"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"


[lib]
path = "src/gpui_wgpu.rs"

[features]
default = []
font-kit = ["dep:font-kit"]

[dependencies]
gpui = { default-features = false, git = "https://github.com/l0ng-ai/zed", branch = "tty7" }
anyhow = { version = "1.0.86" }
bytemuck = "1"
collections = { version = "0.1.0", git = "https://github.com/l0ng-ai/zed", branch = "tty7" }
cosmic-text = "0.19.0"
etagere = "0.2"
itertools = { version = "0.14.0" }
log = { version = "0.4.16", features = ["kv_unstable_serde", "serde"] }
parking_lot = { version = "0.12.1" }
profiling = { version = "1" }
raw-window-handle = "0.6"
smallvec = { version = "1.6", features = ["union", "const_new"] }
swash = "0.2.6"
unicode-segmentation = "1.10"
gpui_util = { git = "https://github.com/l0ng-ai/zed", branch = "tty7" }
wgpu = { git = "https://github.com/zed-industries/wgpu.git", rev = "357a0c56e0070480ad9daea5d2eaa83150b79e88" }
# Optional: only needed on platforms with multiple font sources (e.g. Linux)
# WARNING: If you change this, you must also publish a new version of zed-font-kit to crates.io
font-kit = { git = "https://github.com/zed-industries/font-kit", rev = "94b0f28166665e8fd2f53ff6d268a14955c82269", package = "zed-font-kit", version = "0.14.1-zed", optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
pollster = { version = "0.4.0" }
[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "0.2.120"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
js-sys = "0.3"
